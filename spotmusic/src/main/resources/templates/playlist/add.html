<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Spotmusic - Nova Playlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">

    <div class="p-4 mb-4 bg-light rounded-3">
        <h1 class="display-6 fw-bold">Spotmusic</h1>
    </div>

    <h4>Nova playlist</h4>
    <hr/>

    <!-- Formulário do Thymeleaf: envia os dados via POST para salvar -->
    <form th:action="@{/playlists/salvar}" method="post" th:object="${playlist}">

        <div class="row mb-3">
            <!-- O ID fica oculto, só usamos na hora de editar -->
            <input type="hidden" th:field="*{id}"/>

            <div class="col-md-4">
                <label for="nome" class="form-label">Nome:</label>
                <input class="form-control" id="nome" type="text" th:field="*{nome}"/>
                <!-- Exibe o erro se o nome estiver vazio ou fora do tamanho -->
                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>

            <div class="col-md-8">
                <label for="descricao" class="form-label">Descrição:</label>
                <input class="form-control" id="descricao" type="text" th:field="*{descricao}"/>
                <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
            </div>
        </div>

        <button class="btn btn-primary" type="submit">Salvar</button>
    </form>

    <hr/>
    <a class="btn btn-secondary" th:href="@{/playlists/listar}">Voltar</a>

    <footer class="footer mt-4 py-3">
        <p>&copy; 2026 Spotmusic Flávio Félix</p>
    </footer>
</div>
</body>
</html>
