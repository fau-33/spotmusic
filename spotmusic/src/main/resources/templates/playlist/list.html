<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Spotmusic - Playlists</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">

    <div class="p-4 mb-4 bg-light rounded-3">
        <h1 class="display-6 fw-bold">Spotmusic</h1>
    </div>

    <div class="mb-3">
        <!-- BOTÃO ATUALIZADO: Agora ele leva para a tela de cadastro -->
        <a class="btn btn-primary" th:href="@{/playlists/cadastro}">Nova playlist</a>
    </div>

    <hr/>

    <!-- MENSAGEM DE SUCESSO -->
    <div th:if="${mensagem != null}">
        <div class="alert alert-success" role="alert">
            <span th:text="${mensagem}"></span>
        </div>
    </div>

    <div th:if="${not #lists.isEmpty(playlists)}">
        <h4>Playlists</h4>
        <table class="table table-striped table-hover mt-3">
            <thead class="table-dark">
            <tr>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Ação</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="playlist : ${playlists}">
                <td>
                    <a href="#" th:text="${playlist.nome}">Nome</a>
                </td>
                <td th:text="${playlist.descricao}">Descrição</td>
                <td>
                    <a class="btn btn-sm btn-info" href="#">Editar</a>
                    <a class="btn btn-sm btn-danger" href="#">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(playlists)}">
        <div class="alert alert-info" role="alert">
            ⚠️ Nenhuma playlist cadastrada ainda!
        </div>
    </div>

    <hr/>
    <a class="btn btn-secondary" href="/home">Voltar</a>

    <footer class="footer mt-4 py-3">
        <p>&copy; 2026 Spotmusic Flávio Félix</p>
    </footer>
</div>
</body>
</html>
