<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Spotmusic - Playlists</title>
    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">

    <div class="p-4 mb-4 bg-light rounded-3">
        <h1 class="display-6 fw-bold">Spotmusic</h1>
    </div>

    <div class="mb-3">
        <a class="btn btn-primary" th:href="@{/playlists/cadastro}">Nova playlist</a>
    </div>

    <hr/>

    <div th:if="${mensagem != null}">
        <div class="alert alert-success" role="alert">
            <span th:text="${mensagem}"></span>
        </div>
    </div>

    <div th:if="${not #lists.isEmpty(playlists)}">
        <h4>Playlists</h4>
        <table class="table table-striped table-hover mt-3">
            <thead class="table-dark">
            <tr>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Ação</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="playlist : ${playlists}">
                <td>
                    <a href="#" th:text="${playlist.nome}">Nome</a>
                </td>
                <td th:text="${playlist.descricao}">Descrição</td>
                <td>
                    <a class="btn btn-sm btn-info" th:href="@{/playlists/{id}/atualizar(id=${playlist.id})}">Editar</a>

                    <!-- BOTÃO QUE ABRE A MODAL CHIQUE -->
                    <button type="button" class="btn btn-sm btn-danger" data-bs-toggle="modal" th:data-bs-target="'#modalExcluir' + ${playlist.id}">
                        Excluir
                    </button>

                    <!-- A JANELINHA FLUTUANTE (MODAL) DO BOOTSTRAP -->
                    <div class="modal fade" th:id="'modalExcluir' + ${playlist.id}" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-header bg-danger text-white">
                                    <h5 class="modal-title">Confirmar Exclusão</h5>
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    Tem certeza que deseja apagar a playlist <strong th:text="${playlist.nome}"></strong>? Essa ação não pode ser desfeita.
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    <a class="btn btn-danger" th:href="@{/playlists/{id}/remover(id=${playlist.id})}">Sim, apagar!</a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- FIM DA MODAL -->

                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(playlists)}">
        <div class="alert alert-info" role="alert">
            ⚠️ Nenhuma playlist cadastrada ainda!
        </div>
    </div>

    <hr/>
    <a class="btn btn-secondary" href="/home">Voltar</a>

    <footer class="footer mt-4 py-3">
        <p>&copy; 2026 Spotmusic Flávio Félix</p>
    </footer>
</div>

<!-- JS do Bootstrap (Necessário para a Modal funcionar) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
