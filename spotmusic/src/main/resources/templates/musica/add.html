<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Spotmusic - Músicas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">

  <div class="p-4 mb-4 bg-light rounded-3">
    <h1 class="display-6 fw-bold">Spotmusic</h1>
  </div>

  <h4>Nova música</h4>
  <hr/>

  <form th:action="@{/playlists/{playlistId}/musicas/salvar(playlistId=${playlistId})}" method="post" th:object="${musica}">

    <input type="hidden" th:field="*{id}"/>

    <div class="row mb-3">
      <div class="col-md-5">
        <label for="titulo" class="form-label">Título:</label>
        <input class="form-control" id="titulo" type="text" th:field="*{titulo}"/>
        <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
      </div>

      <div class="col-md-5">
        <label for="banda" class="form-label">Banda:</label>
        <input class="form-control" id="banda" type="text" th:field="*{banda}"/>
        <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('banda')}" th:errors="*{banda}"></div>
      </div>

      <div class="col-md-2">
        <label for="nota" class="form-label">Nota (0 a 10):</label>
        <input class="form-control" id="nota" type="number" th:field="*{nota}"/>
        <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('nota')}" th:errors="*{nota}"></div>
      </div>
    </div>

    <button class="btn btn-primary" type="submit">Salvar Música</button>
  </form>

  <hr/>
  <a class="btn btn-secondary" th:href="@{/playlists/{playlistId}/musicas/listar(playlistId=${playlistId})}">Voltar para Músicas</a>

  <footer class="footer mt-4 py-3">
    <p>&copy; 2026 Spotmusic Flávio Félix</p>
  </footer>
</div>
</body>
</html>
