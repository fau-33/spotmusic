<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Spotmusic - Músicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">

    <div class="p-4 mb-4 bg-light rounded-3">
        <h1 class="display-6 fw-bold">Spotmusic</h1>
    </div>

    <div class="mb-3">
        <a class="btn btn-primary" th:href="@{/playlists/{playlistId}/musicas/cadastro(playlistId=${playlistId})}">Nova música</a>
    </div>

    <hr/>

    <div th:if="${mensagem != null}">
        <div class="alert alert-success" role="alert">
            <span th:text="${mensagem}"></span>
        </div>
    </div>

    <div th:if="${not #lists.isEmpty(musicas)}">
        <h4>Músicas da Playlist</h4>
        <table class="table table-striped table-hover mt-3">
            <thead class="table-dark">
            <tr>
                <th>Título</th>
                <th>Banda</th>
                <th>Nota</th>
                <th>Ação</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="musica : ${musicas}">
                <td th:text="${musica.titulo}">Título</td>
                <td th:text="${musica.banda}">Banda</td>
                <td th:text="${musica.nota}">Nota</td>
                <td>
                    <!-- BOTÃO EDITAR -->
                    <a class="btn btn-sm btn-info" th:href="@{/playlists/{playlistId}/musicas/{musicaId}/atualizar(playlistId=${playlistId}, musicaId=${musica.id})}">Editar</a>

                    <!-- BOTÃO EXCLUIR (ABRE A MODAL) -->
                    <button type="button" class="btn btn-sm btn-danger" data-bs-toggle="modal" th:data-bs-target="'#modalExcluirMusica' + ${musica.id}">
                        Excluir
                    </button>

                    <!-- MODAL DE EXCLUSÃO DA MÚSICA -->
                    <div class="modal fade" th:id="'modalExcluirMusica' + ${musica.id}" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-header bg-danger text-white">
                                    <h5 class="modal-title">Confirmar Exclusão</h5>
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    Tem certeza que deseja apagar a música <strong th:text="${musica.titulo}"></strong>?
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    <a class="btn btn-danger" th:href="@{/playlists/{playlistId}/musicas/{musicaId}/remover(playlistId=${playlistId}, musicaId=${musica.id})}">Sim, apagar!</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(musicas)}">
        <div class="alert alert-info" role="alert">
            ⚠️ Nenhuma música cadastrada nesta playlist!
        </div>
    </div>

    <hr/>
    <a class="btn btn-secondary" th:href="@{/playlists/listar}">Voltar para Playlists</a>

    <footer class="footer mt-4 py-3">
        <p>&copy; 2026 Spotmusic Flávio Félix</p>
    </footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
