<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Spotmusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<div class="container mt-5">


    <div class="p-5 mb-4 bg-light rounded-3">
        <div class="container-fluid py-5">
            <h1 class="display-5 fw-bold">Spotmusic</h1>
            <p class="col-md-8 fs-4">Crie playlists e avalie músicas</p>
        </div>
    </div>

    <!-- A área do botão de Playlists -->
    <div class="row">
        <div class="col-md-6">
            <!-- Espaço vazio na esquerda para empurrar o texto pra direita -->
        </div>
        <div class="col-md-6">
            <h3>Conheça as playlists</h3>
            <p>Aqui você pode acessar as playlists cadastradas ou adicionar novas.</p>
            <p>
                <a class="btn btn-success" href="/playlists/listar">Playlists</a>
            </p>
        </div>
    </div>

    <hr/>

    <!-- O rodapé -->
    <footer class="footer mt-auto py-3">
        <p>&copy; 2026 Spotmusic Flávio Félix</p>
    </footer>
