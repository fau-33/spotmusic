spring.datasource.url=jdbc:postgresql://spotmusic-pg-projetospotmusic.c.aivencloud.com:20209/defaultdb?sslmode=require
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões HikariCP otimizado para instância PostgreSQL com recursos limitados
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# Altere para "update" apenas quando houver alteração nas entidades
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true


logging.level.org.springframework.test=WARN
logging.level.org.springframework.boot.test=WARN
logging.level.org.springframework.boot.devtools=WARN